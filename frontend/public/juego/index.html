<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apagá el incendio</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main id="app">
    <header id="banner">
      <h1 id="title">Apagá el incendio con Tino</h1>
      <p id="intro">Conectando con Tino...</p>
      <div id="meters">
        <span id="clock" title="Tiempo de la partida">2:30</span>
        <span id="stress" title="Estrés"><span class="label">Estrés</span><span class="meter"><span class="fill"></span></span></span>
        <span id="points">0 pts</span>
      </div>
    </header>

    <!-- El canvas tiene resolución interna fija (320x200); se escala para llenar este espacio. -->
    <div id="stage">
      <canvas id="game" aria-label="Juego isométrico pixel art"></canvas>
      <div id="toast" role="status" aria-live="assertive" hidden></div>
      <div id="final" role="dialog" aria-live="polite" hidden>
        <h2 id="final-title"></h2>
        <dl id="final-kpis"></dl>
      </div>
    </div>

    <aside id="coach" aria-live="polite" hidden>
      <span id="coach-arrow" aria-hidden="true">◀ Tino</span>
      <div class="coach-body">
        <small id="coach-step"></small>
        <strong id="coach-title"></strong>
        <p id="coach-text"></p>
      </div>
      <div class="coach-actions">
        <button id="coach-next" type="button">Siguiente ▸</button>
        <button id="coach-hide" type="button">Entendido</button>
      </div>
    </aside>

    <section id="panel" aria-label="Problemas para resolver">
      <ul id="tasks"></ul>
    </section>

    <div id="bubble" hidden>
      <span id="bubble-text"></span>
      <small id="bubble-warning" hidden></small>
    </div>
    <div id="status" hidden></div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
