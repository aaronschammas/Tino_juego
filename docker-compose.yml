services:
  # Backend (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: tino-backend
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT_HOST}:${PORT}'
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - TZ=America/Argentina/Buenos_Aires
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/src/dist
    networks:
      - tino-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+process.env.PORT+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    command: >
      sh -c "npx prisma migrate deploy && npx prisma generate && npm run start:dev"

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tino-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT_HOST}:${FRONTEND_PORT_CONTAINER}'
    env_file:
      - .env
    environment:
      - WATCHPACK_POLLING=true
      - TZ=America/Argentina/Buenos_Aires
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - tino-network
    command: npm run dev

networks:
  tino-network:
    driver: bridge
